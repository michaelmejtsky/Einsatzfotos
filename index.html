<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#25346f">
  <meta name="application-name" content="Einsatzfotos">
  <meta name="apple-mobile-web-app-title" content="Einsatzfotos">

  <title>Einsatzfotos – Feuerwehr St. Pölten-Stadt</title>

  <link rel="icon" type="image/png" sizes="512x512" href="./einsatzfotos-icon.png?v=20260922">
  <link rel="shortcut icon" type="image/png" href="./einsatzfotos-icon.png?v=20260922">
  <link rel="apple-touch-icon" sizes="180x180" href="./einsatzfotos-icon.png?v=20260922">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6fa;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: linear-gradient(135deg, #f4f6fa, #eef1fb);
    }

    .card {
      width: min(420px, 100%);
      padding: 28px 22px;
      border: 1px solid #e4e8f0;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 35px rgba(38,54,111,.10);
      text-align: center;
    }

    .app-icon {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 14px;
    }

    .app-icon img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      display: block;
      padding: 5px;
      border-radius: 22px;
      background: #fff;
      border: 1px solid #e4e8f0;
      box-shadow: 0 8px 22px rgba(38,54,111,.10);
    }

    .camera-badge {
      position: absolute;
      right: -7px;
      bottom: -5px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #34499a;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 5px 14px rgba(38,54,111,.24);
    }

    .brand {
      margin-bottom: 7px;
      color: #34499a;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      color: #25346f;
      font-size: 24px;
      line-height: 1.15;
    }

    p {
      margin: 8px 0 0;
      color: #718096;
      font-size: 12px;
      line-height: 1.45;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 20px auto 0;
      border: 4px solid #e4e8f0;
      border-top-color: #34499a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <iframe
    id="einsatzfotosFrame"
    src="https://script.google.com/a/macros/feuerwehr-stpoelten.at/s/AKfycbzXezf6v1Awy4reSELJwuNy_T3PHSMICD7xBCsp4BpF4DxUOm98kpBrYYF4hkuSI8WsaQ/exec"
    allow="camera; clipboard-read; clipboard-write"
  ></iframe>

  <div id="loading">
    <div class="card">
      <div class="app-icon">
        <img src="./einsatzfotos-icon.png?v=20260922" alt="Feuerwehr St. Pölten-Stadt">
        <div class="camera-badge" aria-hidden="true">📷</div>
      </div>

      <div class="brand">FEUERWEHR ST. PÖLTEN-STADT</div>
      <h1>Einsatzfotos</h1>
      <p>Fotoübermittlung wird geladen …</p>

      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('einsatzfotosFrame');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', function() {
      loading.style.display = 'none';
    });

    setTimeout(function() {
      loading.style.display = 'none';
    }, 10000);

    // Falls in diesem GitHub-Repo noch ein alter Service Worker hängt:
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) {
          try {
            const scopePath = new URL(reg.scope).pathname;
            const here = new URL('.', location.href).pathname;
            if (scopePath === here) reg.unregister();
          } catch (_) {}
        });
      });
    }
  </script>

</body>
</html>
